<svg width="1000" height="520" viewBox="0 0 1000 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="520" rx="16" fill="#0B0F19"/>

  <text x="40" y="50" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">🧩 DesignMint Built-in Accessible Components</text>
  <text x="40" y="75" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Each component features WCAG 2.2 AA/AAA specs, keyboard nav, TalkBack, VoiceOver traits &amp; haptics</text>

  <!-- Row 1: Actions & Inputs -->
  <g transform="translate(40, 110)">
    <!-- Card 1: Buttons -->
    <rect width="280" height="170" rx="12" fill="#131B2E" stroke="#1E293B"/>
    <text x="20" y="32" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="600" text-transform="uppercase">Buttons</text>
    <rect x="20" y="48" width="115" height="36" rx="6" fill="#2563EB"/>
    <text x="40" y="71" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="600">Primary</text>
    <rect x="145" y="48" width="115" height="36" rx="6" fill="#1E293B" stroke="#475569"/>
    <text x="168" y="71" fill="#CBD5E1" font-family="sans-serif" font-size="13" font-weight="600">Outline</text>
    <rect x="20" y="96" width="115" height="36" rx="6" fill="#DC2626"/>
    <text x="35" y="119" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="600">Destructive</text>
    <rect x="145" y="96" width="115" height="36" rx="6" fill="#1E293B" opacity="0.5"/>
    <text x="175" y="119" fill="#64748B" font-family="sans-serif" font-size="13" font-weight="600">Disabled</text>
    <text x="20" y="152" fill="#3B82F6" font-family="monospace" font-size="10">role="button" • Enter / Space • 44px</text>

    <!-- Card 2: Inputs -->
    <g transform="translate(310, 0)">
      <rect width="280" height="170" rx="12" fill="#131B2E" stroke="#1E293B"/>
      <text x="20" y="32" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="600" text-transform="uppercase">Form Inputs</text>
      <text x="20" y="60" fill="#CBD5E1" font-family="sans-serif" font-size="12">Email Address *</text>
      <rect x="20" y="70" width="240" height="36" rx="6" fill="#0B0F19" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="30" y="93" fill="#FFFFFF" font-family="sans-serif" font-size="13">user@example.com</text>
      <text x="20" y="125" fill="#EF4444" font-family="sans-serif" font-size="11">⚠️ Required field format</text>
      <text x="20" y="152" fill="#3B82F6" font-family="monospace" font-size="10">aria-invalid="true" • aria-errormessage</text>
    </g>

    <!-- Card 3: Selection Controls -->
    <g transform="translate(620, 0)">
      <rect width="300" height="170" rx="12" fill="#131B2E" stroke="#1E293B"/>
      <text x="20" y="32" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="600" text-transform="uppercase">Selection Controls</text>
      <!-- Checkbox -->
      <rect x="20" y="52" width="20" height="20" rx="4" fill="#2563EB"/>
      <path d="M24 62L28 66L36 56" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <text x="50" y="67" fill="#E2E8F0" font-family="sans-serif" font-size="13">Multi-select (Checkbox)</text>
      <!-- Radio -->
      <circle cx="30" cy="94" r="10" fill="#0B0F19" stroke="#2563EB" stroke-width="2"/>
      <circle cx="30" cy="94" r="5" fill="#2563EB"/>
      <text x="50" y="99" fill="#E2E8F0" font-family="sans-serif" font-size="13">Single-select (Radio)</text>
      <!-- Toggle -->
      <rect x="20" y="118" width="40" height="22" rx="11" fill="#2563EB"/>
      <circle cx="49" cy="129" r="8" fill="#FFFFFF"/>
      <text x="70" y="134" fill="#E2E8F0" font-family="sans-serif" font-size="13">Instant Switch (Toggle)</text>
    </g>
  </g>

  <!-- Row 2: Badges, Feedback & Tabs -->
  <g transform="translate(40, 310)">
    <!-- Card 4: Badges & Chips -->
    <rect width="280" height="170" rx="12" fill="#131B2E" stroke="#1E293B"/>
    <text x="20" y="32" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="600" text-transform="uppercase">Status Badges &amp; Chips</text>
    <rect x="20" y="52" width="75" height="26" rx="13" fill="#064E3B"/>
    <text x="32" y="69" fill="#6EE7B7" font-family="sans-serif" font-size="11" font-weight="600">Active</text>
    <rect x="105" y="52" width="85" height="26" rx="13" fill="#7F1D1D"/>
    <text x="117" y="69" fill="#FCA5A5" font-family="sans-serif" font-size="11" font-weight="600">Inactive</text>
    <rect x="200" y="52" width="60" height="26" rx="13" fill="#78350F"/>
    <text x="210" y="69" fill="#FDE68A" font-family="sans-serif" font-size="11" font-weight="600">Beta</text>
    <!-- Filter Chips -->
    <rect x="20" y="95" width="100" height="32" rx="16" fill="#1E3A8A" stroke="#3B82F6"/>
    <text x="36" y="116" fill="#93C5FD" font-family="sans-serif" font-size="12">Tag: Core ✕</text>
    <rect x="130" y="95" width="110" height="32" rx="16" fill="#1E293B" stroke="#475569"/>
    <text x="146" y="116" fill="#94A3B8" font-family="sans-serif" font-size="12">+ Add Filter</text>
    <text x="20" y="152" fill="#3B82F6" font-family="monospace" font-size="10">role="status" • Not color-dependent</text>

    <!-- Card 5: Tabs -->
    <g transform="translate(310, 0)">
      <rect width="280" height="170" rx="12" fill="#131B2E" stroke="#1E293B"/>
      <text x="20" y="32" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="600" text-transform="uppercase">Navigation Tabs</text>
      <text x="25" y="65" fill="#3B82F6" font-family="sans-serif" font-size="14" font-weight="600">Overview</text>
      <rect x="20" y="74" width="70" height="3" rx="1.5" fill="#3B82F6"/>
      <text x="110" y="65" fill="#94A3B8" font-family="sans-serif" font-size="14">Tokens</text>
      <text x="180" y="65" fill="#94A3B8" font-family="sans-serif" font-size="14">Export</text>
      <line x1="20" y1="76" x2="260" y2="76" stroke="#334155"/>
      <rect x="20" y="95" width="240" height="42" rx="6" fill="#0B0F19"/>
      <text x="32" y="121" fill="#E2E8F0" font-family="sans-serif" font-size="12">Viewing tab panel context...</text>
      <text x="20" y="154" fill="#3B82F6" font-family="monospace" font-size="10">role="tablist" • Arrow key navigation</text>
    </g>

    <!-- Card 6: Alerts & Feedback -->
    <g transform="translate(620, 0)">
      <rect width="300" height="170" rx="12" fill="#131B2E" stroke="#1E293B"/>
      <text x="20" y="32" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="600" text-transform="uppercase">Alerts &amp; Dialogs</text>
      <!-- Alert Banner -->
      <rect x="20" y="50" width="260" height="46" rx="8" fill="#064E3B" stroke="#059669"/>
      <text x="35" y="72" fill="#A7F3D0" font-family="sans-serif" font-size="12" font-weight="600">✓ System update complete</text>
      <text x="35" y="87" fill="#6EE7B7" font-family="sans-serif" font-size="10">All design tokens synchronized.</text>
      <!-- Modal Preview -->
      <rect x="20" y="106" width="260" height="42" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="35" y="132" fill="#F1F5F9" font-family="sans-serif" font-size="12">Modal (Escape / Focus Trap)</text>
    </g>
  </g>
</svg>
