<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="400" rx="16" fill="url(#bg-gradient)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.1">
    <path d="M0 50H1200M0 100H1200M0 150H1200M0 200H1200M0 250H1200M0 300H1200M0 350H1200" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M100 0V400M200 0V400M300 0V400M400 0V400M500 0V400M600 0V400M700 0V400M800 0V400M900 0V400M1000 0V400M1100 0V400" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Glowing accent orb -->
  <circle cx="950" cy="200" r="160" fill="url(#orb-glow)" opacity="0.35" filter="blur(60px)"/>

  <!-- Left Column: Branding & Messaging -->
  <g transform="translate(70, 0)">
    <!-- Top badge -->
    <rect x="0" y="55" width="168" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="18" cy="71" r="5" fill="#10B981"/>
    <text x="32" y="75" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">WCAG 2.2 AA / AAA</text>

    <!-- Main Title -->
    <g transform="translate(0, 140)">
      <text x="0" y="0" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">🌿 DesignMint</text>
    </g>

    <!-- Subtitles with clean line-wrapping -->
    <text x="0" y="185" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600">Mint your design system in minutes.</text>
    <text x="0" y="215" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">Accessibility-first tokens for Web, Compose MP, iOS &amp; Flutter.</text>
    <text x="0" y="238" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">Aligned with Figma • Built-in MCP for AI Agents.</text>

    <!-- Feature pills (compact, well-spaced 2x2 grid or clean single row) -->
    <g transform="translate(0, 275)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="128" height="38" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="14" y="24" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📱 Multiplatform</text>

      <!-- Pill 2 -->
      <rect x="138" y="0" width="112" height="38" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
      <text x="152" y="24" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">♿ WCAG 2.2</text>

      <!-- Pill 3 -->
      <rect x="260" y="0" width="118" height="38" rx="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
      <text x="274" y="24" fill="#DDD6FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🤖 Agent MCP</text>

      <!-- Pill 4 -->
      <rect x="388" y="0" width="118" height="38" rx="8" fill="#1E293B" stroke="#EC4899" stroke-width="1.5"/>
      <text x="402" y="24" fill="#FBCFE8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🎨 Figma Sync</text>
    </g>
  </g>

  <!-- Right Column: Interactive Window Mockup (positioned with safe margin at x=690) -->
  <g transform="translate(690, 60)">
    <!-- Window card -->
    <rect width="440" height="280" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.6))"/>
    
    <!-- Window titlebar -->
    <rect width="440" height="40" rx="14" fill="#1E293B"/>
    <circle cx="22" cy="20" r="5" fill="#EF4444"/>
    <circle cx="38" cy="20" r="5" fill="#F59E0B"/>
    <circle cx="54" cy="20" r="5" fill="#10B981"/>
    <text x="80" y="24" fill="#94A3B8" font-family="monospace" font-size="12">designmint.config.yaml</text>

    <!-- Buttons row -->
    <rect x="25" y="62" width="185" height="38" rx="8" fill="#2563EB"/>
    <text x="64" y="86" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Primary Button</text>

    <rect x="230" y="62" width="185" height="38" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <text x="282" y="86" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Secondary</text>

    <!-- Toggle & Checkbox row -->
    <g transform="translate(25, 120)">
      <rect x="0" y="2" width="46" height="24" rx="12" fill="#2563EB"/>
      <circle cx="34" cy="14" r="9" fill="#FFFFFF"/>
      <text x="58" y="19" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Dark Theme</text>

      <g transform="translate(205, 2)">
        <rect x="0" y="0" width="22" height="22" rx="5" fill="#2563EB"/>
        <path d="M4 11L9 16L18 5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="17" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Accessible</text>
      </g>
    </g>

    <!-- 10-step Color scale palette squares -->
    <g transform="translate(25, 168)">
      <rect x="0" y="0" width="35" height="26" rx="4" fill="#eff6ff"/>
      <rect x="39" y="0" width="35" height="26" rx="4" fill="#bfdbfe"/>
      <rect x="78" y="0" width="35" height="26" rx="4" fill="#60a5fa"/>
      <rect x="117" y="0" width="35" height="26" rx="4" fill="#3b82f6"/>
      <rect x="156" y="0" width="35" height="26" rx="4" fill="#2563eb"/>
      <rect x="195" y="0" width="35" height="26" rx="4" fill="#1d4ed8"/>
      <rect x="234" y="0" width="35" height="26" rx="4" fill="#1e40af"/>
      <rect x="273" y="0" width="35" height="26" rx="4" fill="#1e3a8a"/>
      <rect x="312" y="0" width="35" height="26" rx="4" fill="#172554"/>
      <rect x="351" y="0" width="35" height="26" rx="4" fill="#080e24"/>
    </g>

    <!-- Contrast score indicator pill -->
    <g transform="translate(25, 214)">
      <rect x="0" y="0" width="390" height="36" rx="8" fill="#132338" stroke="#1E3A8A" stroke-width="1"/>
      <circle cx="20" cy="18" r="5" fill="#10B981"/>
      <text x="36" y="22" fill="#60A5FA" font-family="monospace" font-size="12" font-weight="600">Contrast Ratio: 5.17:1 • WCAG AA Pass</text>
    </g>
  </g>

  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="orb-glow" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
