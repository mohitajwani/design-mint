name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Package & Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build All Monorepo Packages
        run: npm run build

      - name: Run Test Suite
        run: npm run test

      - name: Package Release Tarballs
        run: |
          mkdir -p release-artifacts
          for pkg in core cli mcp-server figma-sync; do
            cd packages/$pkg
            npm pack --pack-destination ../../release-artifacts
            cd ../..
          done
          ls -la release-artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: designmint-npm-packages
          path: release-artifacts/*.tgz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-artifacts/*.tgz
          generate_release_notes: true
