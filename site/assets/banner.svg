<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="400" rx="16" fill="url(#bg-gradient)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.1">
    <path d="M0 50H1200M0 100H1200M0 150H1200M0 200H1200M0 250H1200M0 300H1200M0 350H1200" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M100 0V400M200 0V400M300 0V400M400 0V400M500 0V400M600 0V400M700 0V400M800 0V400M900 0V400M1000 0V400M1100 0V400" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Glowing accent orb -->
  <circle cx="950" cy="200" r="160" fill="url(#orb-glow)" opacity="0.4" filter="blur(60px)"/>

  <!-- Brand badge -->
  <rect x="80" y="60" width="160" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <circle cx="100" cy="77" r="6" fill="#10B981"/>
  <text x="116" y="82" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">WCAG 2.2 AA / AAA</text>

  <!-- Title -->
  <text x="80" y="150" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">🌿 DesignMint</text>
  
  <!-- Subtitle -->
  <text x="80" y="200" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500">Mint your design system in minutes.</text>
  <text x="80" y="235" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">Accessibility-first tokens • Web • iOS • Compose Multiplatform • Flutter • Figma • Built-in MCP</text>

  <!-- Feature pills -->
  <g transform="translate(80, 275)">
    <rect x="0" y="0" width="130" height="42" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="24" y="26" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">📱 Multiplatform</text>

    <rect x="145" y="0" width="120" height="42" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <text x="169" y="26" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">♿ WCAG 2.2</text>

    <rect x="280" y="0" width="135" height="42" rx="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="304" y="26" fill="#DDD6FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">🤖 Agent MCP</text>

    <rect x="430" y="0" width="125" height="42" rx="8" fill="#1E293B" stroke="#EC4899" stroke-width="1.5"/>
    <text x="454" y="26" fill="#FBCFE8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">🎨 Figma Sync</text>
  </g>

  <!-- Visual preview mockup on right -->
  <g transform="translate(720, 70)">
    <!-- Window card -->
    <rect width="400" height="260" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5" filter="drop-shadow(0 20px 25px rgba(0,0,0,0.5))"/>
    
    <!-- Window titlebar -->
    <rect width="400" height="38" rx="12" fill="#1E293B"/>
    <circle cx="20" cy="19" r="5" fill="#EF4444"/>
    <circle cx="36" cy="19" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="19" r="5" fill="#10B981"/>
    <text x="75" y="23" fill="#64748B" font-family="monospace" font-size="12">designmint.config.yaml</text>

    <!-- Mini component previews inside window -->
    <rect x="25" y="60" width="165" height="36" rx="8" fill="#2563EB"/>
    <text x="50" y="83" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Primary Button</text>

    <rect x="210" y="60" width="165" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <text x="248" y="83" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Secondary</text>

    <!-- Toggle & Checkbox mock -->
    <rect x="25" y="115" width="46" height="24" rx="12" fill="#2563EB"/>
    <circle cx="59" cy="127" r="9" fill="#FFFFFF"/>
    <text x="82" y="132" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Dark Theme</text>

    <rect x="210" y="115" width="22" height="22" rx="4" fill="#2563EB"/>
    <path d="M214 126L219 131L228 120" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="242" y="131" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Accessible</text>

    <!-- Color bar steps -->
    <g transform="translate(25, 160)">
      <rect x="0" y="0" width="31" height="24" rx="4" fill="#eff6ff"/>
      <rect x="35" y="0" width="31" height="24" rx="4" fill="#bfdbfe"/>
      <rect x="70" y="0" width="31" height="24" rx="4" fill="#60a5fa"/>
      <rect x="105" y="0" width="31" height="24" rx="4" fill="#3b82f6"/>
      <rect x="140" y="0" width="31" height="24" rx="4" fill="#2563eb"/>
      <rect x="175" y="0" width="31" height="24" rx="4" fill="#1d4ed8"/>
      <rect x="210" y="0" width="31" height="24" rx="4" fill="#1e40af"/>
      <rect x="245" y="0" width="31" height="24" rx="4" fill="#1e3a8a"/>
      <rect x="280" y="0" width="31" height="24" rx="4" fill="#172554"/>
      <rect x="315" y="0" width="31" height="24" rx="4" fill="#080e24"/>
    </g>

    <!-- Contrast score pill -->
    <rect x="25" y="202" width="350" height="34" rx="6" fill="#132338" stroke="#1E3A8A" stroke-width="1"/>
    <circle cx="42" cy="219" r="5" fill="#10B981"/>
    <text x="56" y="223" fill="#60A5FA" font-family="monospace" font-size="11" font-weight="600">Contrast Ratio: 5.17:1 • WCAG AA Pass</text>
  </g>

  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="orb-glow" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
