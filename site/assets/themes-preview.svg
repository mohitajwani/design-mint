<svg width="1000" height="380" viewBox="0 0 1000 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="380" rx="16" fill="#0B0F19"/>

  <text x="40" y="45" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">🌓 Automatic Multi-Theme Generation</text>
  <text x="40" y="70" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Every design system automatically compiles dedicated token sets for light, dark, and strict high-contrast modes</text>

  <!-- Theme 1: Light Mode -->
  <g transform="translate(40, 95)">
    <rect width="285" height="250" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.2))"/>
    <!-- Titlebar -->
    <rect width="285" height="36" rx="12" fill="#F8FAFC"/>
    <text x="18" y="23" fill="#0F172A" font-family="sans-serif" font-size="12" font-weight="700">☀️ Light Theme</text>
    <rect x="220" y="8" width="50" height="20" rx="10" fill="#E2E8F0"/>
    <text x="228" y="22" fill="#475569" font-family="sans-serif" font-size="10" font-weight="600">Default</text>

    <!-- Content -->
    <text x="20" y="65" fill="#0F172A" font-family="sans-serif" font-size="16" font-weight="700">Account Overview</text>
    <text x="20" y="85" fill="#64748B" font-family="sans-serif" font-size="12">Manage your subscription</text>
    
    <rect x="20" y="105" width="245" height="38" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="32" y="129" fill="#0F172A" font-family="sans-serif" font-size="13">Standard Plan ($29/mo)</text>
    
    <rect x="20" y="155" width="245" height="38" rx="8" fill="#2563EB"/>
    <text x="95" y="179" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="600">Upgrade Plan</text>

    <text x="20" y="225" fill="#16A34A" font-family="monospace" font-size="11" font-weight="600">✓ Contrast 5.17:1 (WCAG AA)</text>
  </g>

  <!-- Theme 2: Dark Mode -->
  <g transform="translate(355, 95)">
    <rect width="285" height="250" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.5))"/>
    <!-- Titlebar -->
    <rect width="285" height="36" rx="12" fill="#1E293B"/>
    <text x="18" y="23" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="700">🌙 Dark Theme</text>
    <rect x="220" y="8" width="50" height="20" rx="10" fill="#334155"/>
    <text x="228" y="22" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="600">Balanced</text>

    <!-- Content -->
    <text x="20" y="65" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="700">Account Overview</text>
    <text x="20" y="85" fill="#94A3B8" font-family="sans-serif" font-size="12">Manage your subscription</text>
    
    <rect x="20" y="105" width="245" height="38" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="32" y="129" fill="#F8FAFC" font-family="sans-serif" font-size="13">Standard Plan ($29/mo)</text>
    
    <rect x="20" y="155" width="245" height="38" rx="8" fill="#3B82F6"/>
    <text x="95" y="179" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="600">Upgrade Plan</text>

    <text x="20" y="225" fill="#4ADE80" font-family="monospace" font-size="11" font-weight="600">✓ Contrast 7.42:1 (WCAG AA)</text>
  </g>

  <!-- Theme 3: High Contrast Mode -->
  <g transform="translate(670, 95)">
    <rect width="285" height="250" rx="12" fill="#000000" stroke="#FFFFFF" stroke-width="2.5" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.8))"/>
    <!-- Titlebar -->
    <rect width="285" height="36" rx="12" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
    <text x="18" y="23" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="800">⚡ High Contrast</text>
    <rect x="210" y="8" width="65" height="20" rx="4" fill="#FFFFFF"/>
    <text x="216" y="22" fill="#000000" font-family="sans-serif" font-size="10" font-weight="800">WCAG AAA</text>

    <!-- Content -->
    <text x="20" y="65" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="800">Account Overview</text>
    <text x="20" y="85" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600">Manage your subscription</text>
    
    <rect x="20" y="105" width="245" height="38" rx="4" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
    <text x="32" y="129" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Standard Plan ($29/mo)</text>
    
    <rect x="20" y="155" width="245" height="38" rx="4" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/>
    <text x="95" y="179" fill="#000000" font-family="sans-serif" font-size="13" font-weight="800">Upgrade Plan</text>

    <text x="20" y="225" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700">✓ Contrast 21.0:1 (WCAG AAA)</text>
  </g>
</svg>
